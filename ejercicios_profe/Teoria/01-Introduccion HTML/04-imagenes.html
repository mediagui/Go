<!-- Indico que este documento es HTML5. -->
<!doctype html>
<!-- Inicio del documento HTML, especificando el idioma (español). -->
<html>
  <!-- Head INICIO -->
  <head>
    <!-- Estipulo la codificación de caracteres (utf-8). -->
    <meta charset="utf-8" />
    <!-- Estipulo que el diseño se adapte a distintos tamaños de pantalla. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Estipulo el título que aparecerá en la pestaña del navegador. -->
    <title>Imágenes HTML</title>
  </head>
  <!-- Head FIN -->
  <!-- Cuerpo de la página INCIO -->
  <body>
    <!-- Cabecera INICIO -->
    <header>
      <!-- Encabezado de 1er nivel. -->
      <h1>Imágenes en HTML</h1>
    </header>
    <!-- Cabecera FIN -->
    <!-- Contenido principal INICIO -->
    <main>
      <!--
        Tenemos 3 formas principales de incorporar imágenes a nuestra aplicación HTML.

        Todas siempre se realizan con [<img />].

        Para indicar la ubicación de la imagen, ya sea local u online, lo haremos mediante el atributo [src=""].

        En nuestro caso, al no haber visto CSS, necesitaremos utilizar [width=""], para indicar el ancho de la imagen y [height=""] para indicar el alto de la imagen.
      -->
      <!-- Forma 1: Insertar una imagen mediante una URL de internet. -->
      <img
        src="https://i.blogs.es/20644f/sly-cooper-story-recap/1366_2000.jpeg"
        alt="Pandilla de ladrones de Sly Cooper"
        title="Sly Cooper"
        width="299"
        height="199"
      />
      <!-- Inserto un salto de línea. -->
      <br />
      <!--
      Forma dos (NO SE DEBERÍA UTILIZAR) Insertar una imagen mediante la ruta completa.
      -->
      <img
        src="C:/Users/prueb/Desktop/nicolasCaja.jpg"
        alt="Nicolas Caja"
        width="299"
        height="199"
      />
      <!-- Inserto un salto de línea. -->
      <br />
      <!--
      Forma 3: Esta es la forma más recomendada, utilizando la "ruta relativa".

      Para esta forma, voy a crear una carpeta nueva en nuestro proyecto, donde almacenaremos las imágenes.
      -->
      <img
      src="img/nicolasCajaGuapo.jpg"
      alt="Mira que guapo"
      width="299"
      height="199"
      />
    </main>
    <!-- Contenido principal FIN -->
    <!-- Pie INICIO -->
    <footer>
      <!-- Encabezado de 6º nivel a modo de pie de página. -->
      <h6>Todos los derechos reservados - Víctor Luis Glaría Abril &copy;</h6>
    </footer>
    <!-- Pie FIN -->
  </body>
  <!-- Cuerpo de la página FIN -->
</html>
<!-- Documento HTML FIN -->
